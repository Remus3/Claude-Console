[pytest]
# Strict test configuration (setup profile, item ci-pytest-strict).
# Unknown markers and config keys are errors, skips are listed, xfail must really fail,
# discovery stays inside the repo's own tests, and temp dirs are kept only for failures.
testpaths = tests
addopts = --strict-markers --strict-config -rs --durations=10
xfail_strict = true
markers =
    slow: takes more than a few seconds
    serial: must not run in parallel with other tests
    git: needs a git binary and a scratch repository
    network: needs the network; skipped in hermetic runs
    subprocess: starts child processes
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
