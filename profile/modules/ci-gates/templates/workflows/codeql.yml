# Code scanning (setup profile, item ci-workflow-codeql). Weekly and on pushes to the
# default branch. Pin the actions to full commit SHAs before enabling. Private repos
# without code scanning can keep the SARIF file as a run artifact instead of uploading it.
# Set the repository variable CODEQL_LANGUAGES (for example: python, javascript).
name: codeql
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ vars.CODEQL_LANGUAGES }}
      - uses: github/codeql-action/analyze@v3
        timeout-minutes: 40
